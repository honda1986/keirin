name: オッズ取得

on:
  # 月1回の自動取得。7車立ての判定にはオッズ帯(4〜15倍)が要るので、
  # 溜めておかないと後から成績を検証できなくなる。
  # 毎月1日 02:00 UTC = 11:00 JST。odds.js は「昨日から遡る」ので当日は含まず、
  # 確定オッズだけが入る。他のワークフロー(03:00/08:00/14:50 UTC)とも重ならない。
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '書き込むなら apply を選ぶ'
        type: choice
        options:
          - '点検のみ'
          - 'apply'
        default: '点検のみ'
      from:
        description: '開始日 YYYY-MM-DD(必ずハイフン付き)'
        required: false
      to:
        description: '終了日 YYYY-MM-DD(必ずハイフン付き)'
        required: false
      days:
        description: '直近何日ぶんか(from/to を使うなら空でOK)'
        required: false
        default: '1'
      conc:
        description: '同時リクエスト数(既定6・上げすぎ注意)'
        required: false
        default: '6'
      wait:
        description: 'リクエスト間隔ミリ秒(既定150)'
        required: false
        default: '150'
      all:
        description: 'history.json に無いレースも取る(2024年以前の過去分を取るとき)'
        type: boolean
        default: false

concurrency:
  group: odds-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: オッズ取得
        env:
          MODE: ${{ github.event.inputs.mode }}
          FROM: ${{ github.event.inputs.from }}
          TO:   ${{ github.event.inputs.to }}
          DAYS: ${{ github.event.inputs.days }}
          CONC: ${{ github.event.inputs.conc }}
          WAIT: ${{ github.event.inputs.wait }}
          ALL:  ${{ github.event.inputs.all }}
        run: |
          # 定時実行(schedule)では inputs が全部空になるので、ここで既定値を入れる。
          # 手動実行のときは入力に既定値が付いているので、この既定値は効かない。
          # 45日にしてあるのは、1回失敗しても次の月に取りこぼしを拾えるようにするため。
          # 取得済みのレースは odds.js が飛ばすので、重なっても無駄にはならない。
          MODE="${MODE:-apply}"
          DAYS="${DAYS:-45}"
          CONC="${CONC:-6}"
          WAIT="${WAIT:-150}"
          APPLY=""
          if [ "$MODE" = "apply" ]; then APPLY="--apply"; fi
          OPTS="--conc=$CONC --wait=$WAIT"
          if [ "$ALL" = "true" ]; then OPTS="$OPTS --all"; fi
          if [ -n "$FROM" ] && [ -n "$TO" ]; then
            node odds.js "$FROM" "$TO" $APPLY $OPTS
          else
            node odds.js "$DAYS" $APPLY $OPTS
          fi

      - name: コミット(競合対策リトライ付き)
        # 定時実行は常に書き込む。手動実行は apply を選んだときだけ。
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add odds-*.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "オッズ取得"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          echo "6回リトライしても push できませんでした"; exit 1
