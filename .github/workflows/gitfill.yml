name: 履歴の穴埋め(git履歴から)

# 2026-08-28の楽天Kドリームス移行で results.js がレース日を取れず、
# 8/26〜9/21 の結果が history.json に入らなかった。その穴を埋めるための手動実行。
# backfill.js は出走表を gamboo.jp から取るため(WAFで閉鎖)使えない。

on:
  workflow_dispatch:
    inputs:
      from:
        description: '開始日 YYYY-MM-DD (例: 2026-08-28)'
        required: true
      to:
        description: '終了日 YYYY-MM-DD (例: 2026-09-20)'
        required: true
      mode:
        description: '書き込むなら apply を選ぶ。既定は点検のみ'
        required: true
        default: 'check'
        type: choice
        options: [check, apply]
      sanpuku_days:
        description: '3連複配当(p3fpay)を何日ぶん取り込むか。空欄なら40'
        required: false
        default: '40'

# results.yml と同じグループ。history.json の同時書き込みを避ける
concurrency:
  group: history-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gitfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ★fetch-depth: 0 が必須。既定の 1 だと過去の races.json を1件も拾えない
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 穴埋め
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "apply" ]; then
            node gitfill.js --from "$FROM" --to "$TO" --apply
          else
            node gitfill.js --from "$FROM" --to "$TO"
          fi

      - name: 3連複の配当を取り込む
        if: ${{ github.event.inputs.mode == 'apply' }}
        continue-on-error: true
        env:
          DAYS: ${{ github.event.inputs.sanpuku_days }}
        run: node sanpuku.js "${DAYS:-40}" --apply

      - name: コミット(競合対策リトライ付き)
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add history.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "gitfill: git履歴の races.json から結果を復旧"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          echo "6回リトライしても push できませんでした"; exit 1
