name: 全レース更新
on:
  schedule:
    # ★UTCで書く。GitHubの定時実行は数時間遅れることがある(実測1〜7時間)ので、
    #   始発レース(08:30 JST)に間に合うよう、朝の取得は大きく前倒ししてある。
    #   きりの良い分(:00 / :30)は混んで遅れやすいので、わざと外してある。
    - cron: '40 18 * * *'   # 03:40 JST  本命。遅れても始発に間に合う
    - cron: '10 21 * * *'   # 06:10 JST  予備(上が落ちたとき用)
    - cron: '20 3 * * *'    # 12:20 JST  日中の出走変更を拾う
    - cron: '50 7 * * *'    # 16:50 JST  ナイター/ミッドナイト前
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: レース取得
        run: node fetch.js
      - name: コミット
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add races.json scores.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "races update"
          # live.yml(1時間おき)と重なると push が弾かれるので、取り込み直してリトライする
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          echo "6回リトライしても push できませんでした"; exit 1
