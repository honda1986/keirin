name: 全レース更新
on:
  schedule:
    # ★UTCで書く。GitHubの定時実行は数時間遅れることがある(実測1〜7時間。2026-10 は 03:40 予定が 06:40〜07:50 に動いていた)。
    #   きりの良い分(:00 / :30)は混んで遅れやすいので、わざと外してある。
    # ★朝の出走表は 05:00 JST に取る(はむさんの希望・2026-10-07)。定時実行は遅れるので、夜中に起こしておいて
    #   ジョブの中で 05:00 まで待ってから取る(下の「朝5時まで待つ」)。05:00 を過ぎて動き出したらすぐ取る
    - cron: '47 15 * * *'   # 00:47 JST → 05:00 まで待って取る(本命)
    - cron: '17 18 * * *'   # 03:17 JST → 同じ(上が落ちた・遅れすぎたとき用)
    - cron: '10 21 * * *'   # 06:10 JST  予備
    - cron: '20 3 * * *'    # 12:20 JST  日中の出走変更を拾う
    - cron: '50 7 * * *'    # 16:50 JST  ナイター/ミッドナイト前
  workflow_dispatch:
permissions:
  contents: write
# races.json・latest.json を合言葉で暗号化/解く(datafile.js・hikitsugi §4-22)。未設定なら今までどおり暗号化しない
env:
  KEIRIN_PASS: ${{ secrets.KEIRIN_PASS }}

# 本命と予備が両方 05:00 まで待っていると同時に push してぶつかるので、1本ずつ
concurrency:
  group: races-fetch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # checkout より先に待つ(待ってから取り込むので、待っている間の他の更新とぶつからない)
      - name: 朝5時(JST)まで待つ(夜中の定時実行のとき)
        if: github.event_name == 'schedule'
        run: |
          h=$(TZ=Asia/Tokyo date +%-H)
          if [ "$h" -lt 5 ]; then
            w=$(( $(TZ=Asia/Tokyo date -d "05:00" +%s) - $(date +%s) ))
            echo "$(TZ=Asia/Tokyo date +%H:%M) JST。05:00 まで $((w / 60)) 分待ちます"
            sleep "$w"
          else
            echo "$(TZ=Asia/Tokyo date +%H:%M) JST。待たずに取ります"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: レース取得
        run: node fetch.js
      - name: コミット
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add races.json scores.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "races update"
          # live.yml(1時間おき)と重なると push が弾かれるので、取り込み直してリトライする
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          echo "6回リトライしても push できませんでした"; exit 1
