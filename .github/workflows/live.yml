name: 今日の結果(日中)

# 日中に1時間おき、今日の結果(着順・配当)だけを results-today.json に取り込む。
# history.json には触らない(夜の results.yml の仕事)。
# ★UTCで書く。01:17〜15:17 UTC = 10:17〜翌00:17 JST。
#   GitHub の定時実行は遅れることがある(実測1〜7時間)ので、すぐ見たいときは手動で実行する。
on:
  schedule:
    - cron: '17 1-15 * * *'
  workflow_dispatch:

concurrency:
  group: live-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 今日の結果を取得
        run: node live.js
      - name: コミット(競合対策リトライ付き)
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add results-today.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "live results"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          echo "6回リトライしても push できませんでした"; exit 1
