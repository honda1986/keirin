name: 結果収集

on:
  schedule:
    - cron: '50 14 * * *'
  workflow_dispatch:

concurrency:
  group: history-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      # 直近数日の races.json を git 履歴から読むため(gitfill.js)、履歴を少し深く取る
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 汚染データ掃除
        run: node cleanup.js

      - name: 結果収集
        run: node results.js

      # ★直近3日の取り込み漏れを埋める。results.js は「いまの races.json に載っている日」しか見ないので、
      #   23:50 予定のこの処理が GitHub の遅れで翌朝にずれ込み、朝の取得(03:40)が先に races.json を
      #   翌日分へ書き換えると、前日のレースを丸ごと取り逃がす(2026-09-23 分がこれで欠けた)。
      #   gitfill.js は git 履歴の races.json からその日の出走表を探して結果を足す。既にあるレースは触らない。
      - name: 直近3日の取り込み漏れを埋める
        continue-on-error: true
        run: |
          FROM=$(TZ=Asia/Tokyo date -d '3 days ago' +%F)
          TO=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          node gitfill.js --from "$FROM" --to "$TO" --apply

      # 3連複の配当(p3fpay)を直近10日分だけ取り込む。
      # 払戻ページは1日1リクエストなので10日でも数秒。
      # ここが失敗しても当日の結果は残したいので continue-on-error にしてある。
      - name: 3連複の配当を取り込む(直近10日)
        continue-on-error: true
        run: node sanpuku.js 10 --apply

      # 3連複の配当を足した後で成績を作り直す(これが無いと、直近1日の配当が次の晩まで空のまま)
      - name: 成績を作り直す
        run: node results.js --stats-only

      - name: コミット(競合対策リトライ付き)
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add history.json stats.json daily.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "results update"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          echo "6回リトライしても push できませんでした"; exit 1
