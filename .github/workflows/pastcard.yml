name: 過去の出走表の作り直し(検証用)

# pastcard.js で、Kドリームスの過去のレース詳細から出走表・並び予想・評価順位を作り直す。
# ★保存は main ではなく pastcard ブランチ(分析にしか使わない)。月ごとに別の仕事として並べて動かす。
#   同時に読むページ数 = parallel × conc。Kドリームスに締め出されないよう、合計10前後までにする。
# 取り終えた日は飛ばすので、途中で落ちた月は同じ期間でもう一度起動すれば続きから取る。
on:
  workflow_dispatch:
    inputs:
      from:
        description: '開始月 YYYY-MM'
        required: true
        default: '2022-01'
      to:
        description: '終了月 YYYY-MM'
        required: true
        default: '2025-12'
      parallel:
        description: '同時に動かす月の数'
        required: false
        default: '3'
      conc:
        description: '1つの月の中の同時リクエスト数'
        required: false
        default: '2'

concurrency:
  group: pastcard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.m.outputs.months }}
    steps:
      - uses: actions/checkout@v4
      - name: 月の一覧
        id: m
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          node -e '
            const [a, b] = [process.env.FROM, process.env.TO].map((s) => s.split("-").map(Number));
            const out = [];
            for (let y = a[0], m = a[1]; y * 12 + m <= b[0] * 12 + b[1]; m === 12 ? (y++, m = 1) : m++) out.push(y + "-" + String(m).padStart(2, "0"));
            if (!out.length || out.length > 256) { console.error("月の指定がおかしい"); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "months=" + JSON.stringify(out) + "\n");
            console.log(out.join(" "));'
      - name: 保存先(pastcard ブランチ)が無ければ作る
        run: |
          git config --global user.name "race-bot"
          git config --global user.email "actions@github.com"
          if ! git ls-remote --exit-code origin refs/heads/pastcard >/dev/null 2>&1; then
            git worktree add -q --detach pcdir
            cd pcdir
            git checkout -q --orphan pastcard
            git rm -rqf .
            printf '# 過去の出走表の作り直し(検証用)\n\npastcard.js が書く。形式は pastcard.js の先頭を参照。\n' > README.md
            git add README.md
            git commit -qm "pastcard: 記録を始める"
            git push -q origin HEAD:refs/heads/pastcard
          fi

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        month: ${{ fromJSON(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pastcard ブランチを用意
        run: |
          git config --global user.name "race-bot"
          git config --global user.email "actions@github.com"
          git fetch -q origin refs/heads/pastcard
          git worktree add -q --detach pcdir FETCH_HEAD
      - name: 取得
        env:
          MONTH: ${{ matrix.month }}
          CONC: ${{ inputs.conc }}
        run: node pastcard.js --month="$MONTH" --out=pcdir --conc="$CONC"
      - name: pastcard ブランチに保存
        if: ${{ always() }}
        run: |
          cd pcdir
          git add -A
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -qm "出走表 ${{ matrix.month }}"
          for i in 1 2 3 4 5 6 7 8; do
            if git push -q origin HEAD:refs/heads/pastcard; then echo "push成功"; exit 0; fi
            echo "push失敗 $i/8。取り直して重ねる"; sleep $((RANDOM % 10 + 5))
            git fetch -q origin refs/heads/pastcard && git rebase -q FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          exit 1
