name: 再検証(学習→分析→バックテスト)
on:
  workflow_dispatch:
    inputs:
      relearn:
        description: '学習補正をやり直す(yes/no)'
        required: false
        default: 'no'
permissions:
  contents: write
jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: データ点検
        run: node verify.js
      - name: 学習補正のやり直し
        if: ${{ github.event.inputs.relearn == 'yes' }}
        run: |
          echo "########## 学習 ##########"
          node learn.js
      - name: 分析
        run: |
          echo "########## 診断 ##########"
          node diagnose.js
      - name: バックテスト
        run: |
          echo "########## バックテスト ##########"
          node simulate.js
      - name: コミット
        if: always()
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add sim.json weights.json 2>/dev/null || git add sim.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "recheck: 再検証"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          exit 1
