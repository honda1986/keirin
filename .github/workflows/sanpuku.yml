name: 3連複取得

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '書き込むなら apply を選ぶ'
        type: choice
        options:
          - '点検のみ'
          - 'apply'
        default: '点検のみ'

permissions:
  contents: write

concurrency:
  group: history-write
  cancel-in-progress: false

jobs:
  sanpuku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 実行
        run: node sanpuku.js ${{ github.event.inputs.mode == 'apply' && '--apply' || '' }}

      - name: コミット
        if: github.event.inputs.mode == 'apply'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "3連複配当を追加 / 3着を復元"
            git push
          fi
