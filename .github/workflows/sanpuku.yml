name: 3連複取得

on:
  workflow_dispatch:

concurrency:
  group: history-write
  cancel-in-progress: false

jobs:
  sanpuku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node sanpuku.js
