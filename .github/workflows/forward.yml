name: 前向き検証
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: '操作(空欄=成績表示 / addtop=TOP構成を登録 / list=一覧 / remove 1=削除)'
        required: false
        default: ''
concurrency:
  group: history-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 前向き検証
        run: node forward.js ${{ github.event.inputs.cmd }}
      - name: コミット(登録内容の保存)
        if: always()
        run: |
          git config user.name "race-bot"
          git config user.email "actions@github.com"
          git add forward.json 2>/dev/null || true
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "forward: 検証対象を更新"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          exit 1
