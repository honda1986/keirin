<!doctype html><html><head><meta charset="utf-8"><title>偽のオッズパーク（テスト用）</title></head><body>
<!-- テスト用の偽物。実物の作りは知らない。採取されたセレクタ（SSO_ACCOUNTID / #password / #btn_login / 投票する）だけ真似ている -->
<div id="login" style="display:none">
  <input name="SSO_ACCOUNTID"><input id="password" type="password"><button id="btn_login" onclick="document.cookie='sess=1;path=/';location.reload()">ログイン</button>
</div>
<div id="home" style="display:none">
  <a href="#" onclick="document.cookie='sess=;path=/;max-age=0';location.reload()">ログアウト</a>
  <div class="box"><h2>競馬</h2><a class="btn_vote" href="/keiba/auth/VoteKeibaTop.do" onclick="openFullWindow(this.href); return false;">投票する</a></div>
  <div class="box"><h2>オートレース</h2><a class="btn_vote" href="/autorace/auth/VoteAutoraceTop.do" onclick="openFullWindow(this.href); return false;">投票する</a></div>
  <div class="box" id="box2"><h2>競輪</h2><a class="btn_vote" href="/keirin/auth/VoteKeirinTop.do?gamenId=P001&gamenKoumokuId=keirinVote" onclick="openFullWindow(this.href); return false;">投票する</a></div>
</div>
<script>
function openFullWindow(u) { window.open(u, "vote"); }
const on = /(^|; )sess=1/.test(document.cookie);
document.getElementById(on ? "home" : "login").style.display = "block";
</script></body></html>
